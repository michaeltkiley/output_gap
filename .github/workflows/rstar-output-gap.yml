name: Update rstar equilibrium real rate

on:
  schedule:
    # 13:23 UTC on the 1st of every month (offset from :00/edo's :17 to
    # avoid the two Dynare jobs colliding on the same runner minute).
    - cron: '23 13 1 * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'rstar/models/**'
      - 'rstar/scripts/**'
      - '.github/workflows/rstar-output-gap.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Debian/Ubuntu package Dynare directly, with working precompiled
      # Octave MEX bindings -- much simpler than building from source.
      - name: Install Octave + Dynare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dynare octave octave-io

      # The dynare apt package pulls in a JRE (for optional xls/reporting
      # features we don't use). On some runners/CPUs the JVM's own startup
      # CPU-feature probing segfaults as soon as Dynare's estimation code
      # is loaded -- confirmed locally (see edo/README.md). We don't need
      # Java, so remove it.
      - name: Remove Java (works around a JVM/Dynare segfault, unused anyway)
        run: |
          sudo apt-get remove -y -qq default-jre default-jre-headless \
            openjdk-17-jre openjdk-17-jre-headless ant ant-optional || true
          sudo apt-get autoremove -y -qq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r rstar/scripts/requirements.txt

      - name: Ingest FRED data
        run: python3 rstar/scripts/ingest_fred.py

      - name: Ingest SPF long-run inflation expectations
        run: python3 rstar/scripts/ingest_spf.py

      - name: Build model observables
        run: python3 rstar/scripts/build_observables.py

      - name: Re-estimate posterior mode and export results
        working-directory: rstar/models
        run: |
          octave --no-gui --eval "
            dynare rg_base_final.mod noclearall;
            run('../scripts/export_results.m');
          "

      - name: Commit updated outputs to this repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rstar/data/fred.duckdb rstar/data/*_spf_cpi10.csv rstar/outputs/ rstar/models/rg_base_final_mode.mat
          git diff --quiet --cached || git commit -m "Auto-update rstar equilibrium real rate estimate [skip ci]"
          git push

      - name: Trigger resource_utilization rebuild
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $CROSS_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/michaeltkiley/resource_utilization/dispatches \
            -d '{"event_type":"rstar-updated"}'

      - name: Trigger equilibrium_rate rebuild
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $CROSS_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/michaeltkiley/equilibrium_rate/dispatches \
            -d '{"event_type":"rstar-updated"}'
