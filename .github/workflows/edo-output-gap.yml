name: Update EDO output gap

on:
  schedule:
    # 13:17 UTC on the 1st of every month (offset from the top of the hour
    # to avoid GitHub's :00 scheduling congestion).
    - cron: '17 13 1 * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'edo/models/**'
      - 'edo/scripts/**'
      - '.github/workflows/edo-output-gap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Debian/Ubuntu package Dynare directly, with working precompiled
      # Octave MEX bindings -- much simpler than building from source.
      - name: Install Octave + Dynare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dynare octave octave-io

      # The dynare apt package pulls in a JRE (for optional xls/reporting
      # features we don't use). On some runners/CPUs the JVM's own startup
      # CPU-feature probing segfaults as soon as Dynare's estimation code
      # is loaded -- confirmed locally. We don't need Java, so remove it.
      # The exact JRE package tracks whatever's current on the runner's
      # distro (openjdk-21-jre on Ubuntu 24.04 as of 2026-08, vs. the
      # openjdk-17-jre a Debian bookworm container pulled in when this was
      # first diagnosed -- confirmed by reproducing in a real ubuntu:24.04
      # container) so match by glob rather than a pinned version.
      - name: Remove Java (works around a JVM/Dynare segfault, unused anyway)
        run: |
          sudo apt-get remove -y -qq default-jre default-jre-headless \
            'openjdk-*-jre*' ant ant-optional || true
          sudo apt-get autoremove -y -qq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r edo/scripts/requirements.txt

      - name: Ingest FRED data
        run: python3 edo/scripts/ingest_fred.py

      - name: Build model observables
        run: python3 edo/scripts/build_observables.py

      # Diagnostics only, in case the run segfaults below: the Java/JVM
      # cause was ruled out (fixed 2026-08-28, still segfaults) and it
      # hasn't been reproducible in local containers, so if it recurs we
      # want a backtrace + the runner's actual CPU flags rather than a
      # bare exit code to go on.
      - name: "Diagnostics: CPU info"
        run: |
          lscpu
          grep -m1 flags /proc/cpuinfo

      - name: Install gdb (crash diagnostics only)
        run: sudo apt-get install -y -qq gdb

      - name: Run Dynare calib_smoother and export results
        working-directory: edo/models
        # OPENBLAS_NUM_THREADS/OMP_NUM_THREADS=1: GitHub-hosted runners have
        # a known history of segfaults in threaded BLAS/LAPACK kernels on
        # certain CPU types, worse for larger matrix operations -- edo's
        # Kalman smoother (35 state variables) is far bigger than rstar's
        # (15), which hasn't crashed with the same install. Forcing
        # single-threaded BLAS is a cheap, well-precedented mitigation for
        # exactly this failure signature.
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          ulimit -c unlimited
          ulimit -s unlimited
          gdb --batch -ex run -ex bt -ex quit --args octave --no-gui --eval "
            dynare linearized.mod noclearall;
            run('../scripts/export_results.m');
          " 2>&1 | tee /tmp/octave_run.log
          grep -q "Export complete" /tmp/octave_run.log

      - name: Commit updated outputs to this repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add edo/data/fred.duckdb edo/outputs/
          git diff --quiet --cached || git commit -m "Auto-update EDO output gap estimate [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            git fetch origin main
            git rebase origin/main
          done

      - name: Trigger resource_utilization rebuild
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $CROSS_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/michaeltkiley/resource_utilization/dispatches \
            -d '{"event_type":"edo-updated"}'
